# Jerry Xie · Personal Site
# Jekyll + Minimal Mistakes · GitHub Pages

title: Jerry Xie
title_separator: "—"
subtitle: Automotive Systems Engineering · Requirements · OTA Feature Delivery
description: >
  Jerry Xie is an automotive systems and connected-vehicle professional with
  over 10 years of experience across PATAC, SAIC Volkswagen, Ford China and CARIAD China.
  Focus areas include system requirements, functional specifications, integration,
  validation, OTA feature delivery and vehicle-cloud data.
url: https://jerryxrock-droid.github.io
baseurl: ""
repository: jerryxrock-droid/jerryxrock-droid.github.io

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: dark

author:
  name: Jerry Xie
  bio: "Automotive Systems · Requirements · Feature Delivery & Validation"
  location: Shanghai, China
  email: 403197815@qq.com
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:403197815@qq.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jerryxrock-droid"

locale: "zh-CN"
lang: zh-CN
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
